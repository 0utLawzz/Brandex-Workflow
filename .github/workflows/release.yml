name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve notes
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          BODY=$(awk -v tag="$TAG" '
            $0 ~ "^## \\[" tag "\\]" { p=1; print; next }
            p && /^## \\[/ { exit }
            p { print }
          ' CHANGELOG.md)
          if [ -z "$BODY" ]; then
            echo "::error::No matching CHANGELOG.md section for v${TAG}"
            exit 1
          fi
          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }} — Brandex Workflow
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
