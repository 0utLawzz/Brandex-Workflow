name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    name: Lint and build Next.js app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Check required documentation
        run: |
          set -e
          for f in README.md CHANGELOG.md DEPLOY-GUIDE.md THEME.md LICENSE; do
            test -f "$f" || { echo "::error::$f missing"; exit 1; }
          done
