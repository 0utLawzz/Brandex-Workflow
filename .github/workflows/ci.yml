name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  postgres17:
    name: PostgreSQL 17 migrations and fixtures
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: brandex_disposable_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d brandex_disposable_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Apply migrations and rollback fixtures in disposable database
        env:
          PG17_TEST_DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/brandex_disposable_test
        run: node scripts/check-postgres17.mjs

  app:
    name: Lint and build Next.js app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit

      - name: Check Apps Script syntax
        run: node --check < Code.gs

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Verify canonical mail merge contract
        run: node scripts/sync-merge-contract.mjs --check

      - name: Build
        run: npm run build

      - name: Check required documentation
        run: |
          set -e
          for f in README.md CHANGELOG.md CONTRIBUTING.md DEPLOY-GUIDE.md SECURITY.md THEME.md LICENSE; do
            test -f "$f" || { echo "::error::$f missing"; exit 1; }
          done
